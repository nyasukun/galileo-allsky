[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galileo-allsky"
version = "0.1.0"
description = "Local OTLP/HTTP collector that normalizes AI agent telemetry for Galileo"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "galileo-allsky contributors" }]
keywords = ["galileo", "opentelemetry", "otlp", "genai", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "googleapis-common-protos>=1.65,<2",
  "opentelemetry-proto>=1.38,<2",
  "protobuf>=5,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
allsky-collector = "allsky_collector.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allsky_collector = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "integration: multi-component tests using only local stubs",
]

[tool.coverage.run]
branch = true
source = ["allsky_collector"]
omit = ["src/allsky_collector/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
